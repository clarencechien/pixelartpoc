<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f1">
  <title>雙橋剖面｜大永和像素地誌</title>
  <link rel="icon" href="assets/logo-icon.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="bridge-section.css">
  <script type="module" src="bridge-section.js"></script>
</head>
<body class="section-page">
<header class="mast"><a href="./" class="wordmark"><span class="brand-icon"><img src="assets/logo-icon.png" alt=""></span><b>像素地誌</b><span class="latin">PIXEL ATLAS</span></a><a class="back-map" href="./?place=kawabata">回到大永和地圖</a></header>
<main class="section-main">
  <header class="section-intro"><h1>雙橋剖面</h1><p>把剖切線從永和往臺北移，看看新中正橋的鋼拱和川端橋的橋墩在哪裡被切到。</p></header>
  <div class="plots">
    <section class="plan-card" aria-labelledby="plan-title">
      <header class="chart-title"><h2 id="plan-title">橋位俯視圖</h2><span>新店溪</span></header>
      <div id="plan"><div id="plan-image"><img src="city/bridge-plan.png" alt="新中正橋和川端橋並列跨過新店溪，北方朝上。" draggable="false"><div id="cut-line" hidden><b>A</b><i></i><b>B</b></div></div><span class="north">↑ N</span></div>
    </section>
    <section class="profile-card" aria-labelledby="profile-title">
      <header class="chart-title"><h2 id="profile-title">A–B 橫剖面</h2><span>面向臺北</span></header>
      <div class="legend"><span>新中正橋</span><span>川端橋</span></div>
      <canvas id="profile" role="img" aria-label="當前位置的新中正橋與川端橋模型截面"></canvas>
      <p id="reading" role="status">正在載入雙橋模型…</p>
    </section>
  </div>
  <section class="cut-controls" aria-label="移動剖切線">
    <div class="range-head"><label for="station">剖切位置</label><output id="chainage" for="station"></output></div>
    <input id="station" type="range" min="0" max="100" step=".25" value="0" disabled>
    <div class="range-ends"><span>永和側</span><span>臺北側</span></div>
    <div id="presets" aria-label="比較位置"><button disabled>切過舊橋墩</button><button disabled>移到兩墩間</button><button disabled>切過新橋吊索</button></div>
  </section>
  <footer class="section-foot"><p>剖面取自特色高精度模型。高度從模型零點起算，橋墩間距為示意。</p><a href="https://github.com/clarencechien/pixelartpoc/blob/main/docs/making-of.md">地圖製作筆記</a></footer>
</main></body>
</html>
